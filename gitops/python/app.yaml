apiVersion: miabi.io/v1
kind: Database
metadata:
  name: python-example-db
spec:
  engine: postgres
  version: "17-alpine"
---
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: python-example
spec:
  image: ghcr.io/miabi-io/examples/python
  tag: latest
  externalLabel: python-example
  ports:
    - container: 8000
      externalAccess: true
  healthcheck:
    type: http
    path: /healthz
    intervalSeconds: 10
  env:
    DATABASE_URL: "{{ .databases.python-example-db.uri }}"
  secretEnv:
    - DATABASE_URL
  resources:
    memory: 256Mi
    cpu: "0.5"
