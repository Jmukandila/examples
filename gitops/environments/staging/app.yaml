# Staging follows main: every image the publish workflow pushes as latest.
apiVersion: miabi.io/v1
kind: Application
metadata:
  name: go-example
  labels:
    environment: staging
spec:
  image: ghcr.io/miabi-io/examples/go
  tag: latest
  ports:
    - container: 8080
      externalAccess: true
  healthcheck:
    type: http
    path: /healthz
  env:
    APP_NAME: go-example-staging
  resources:
    memory: 64Mi
    cpu: "0.25"
