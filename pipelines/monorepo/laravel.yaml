# Bind to an application created from https://github.com/miabi-io/examples.
# context points the build at one directory of the monorepo.
apiVersion: miabi.io/v1
kind: Pipeline
metadata:
  name: laravel-example
on:
  push:
    branches: [main]
  manual: true
steps:
  - name: test
    image: jkaninda/nginx-php-fpm:8.4
    run: |
      cd laravel
      composer install --no-interaction --no-progress --prefer-dist
      php artisan test

  - name: build
    uses: build
    context: laravel
    dockerfile: laravel/Dockerfile

  - name: scan
    image: aquasec/trivy:0.67.2
    continue-on-error: true
    run: |
      TRIVY_USERNAME="$MIABI_REGISTRY_USER" TRIVY_PASSWORD="$MIABI_REGISTRY_TOKEN" \
        trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$MIABI_IMAGE_DIGEST"

  - name: deploy
    uses: deploy
