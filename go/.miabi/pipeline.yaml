# Runs when this folder is the root of its own repository: create a Git app from that
# repository and Miabi offers to adopt this file. Every deploy then runs it.
apiVersion: miabi.io/v1
kind: Pipeline
metadata:
  name: go-example
on:
  push:
    branches: [main]
  manual: true
env:
  CGO_ENABLED: "0"
steps:
  - name: test
    image: golang:1.25-alpine
    run: go vet ./... && go test ./...

  - name: lint
    image: golangci/golangci-lint:v2.5.0
    continue-on-error: true
    run: golangci-lint run ./...

  # A build step sees no env, so the version reaches the Dockerfile as a file in the context.
  - name: version
    image: alpine:3.22
    run: |
      SHORT=$(echo "$MIABI_COMMIT" | cut -c1-7)
      VERSION="$(cat VERSION)${SHORT:+-$SHORT}"
      echo "$VERSION" > .version
      echo "VERSION=$VERSION" >> "$MIABI_ENV"

  - name: build
    uses: build
    platforms: [linux/amd64, linux/arm64]

  - name: deploy
    uses: deploy
